<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKU Running Club Marathon Registration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d2818; color: #333; padding: 20px 10px; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    /* Poster Image Styling */
    .poster-container { text-align: center; margin-bottom: 20px; }
    .poster-img { width: 100%; max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

    h2 { text-align: center; color: #166534; margin-bottom: 20px; font-weight: 700; text-transform: uppercase; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: #166534; box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.2); }
    
    .radio-group { display: flex; gap: 20px; margin-top: 5px; }
    .radio-group label { font-weight: normal; cursor: pointer; }
    
    .fee-badge { background-color: #fef08a; color: #854d0e; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin: 15px 0; border: 1px solid #fde047; }
    
    button { width: 100%; background-color: #166534; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
    button:hover { background-color: #15803d; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .checkbox-group input { width: auto; margin-top: 3px; }
    .checkbox-group label { font-weight: normal; font-size: 13px; color: #475569; }

    #responseMsg { margin-top: 15px; text-align: center; font-weight: bold; padding: 10px; border-radius: 8px; display: none; }
    .success { background-color: #dcfce7; color: #166534; }
    .error { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">

  <!-- ========================================== -->
  <!-- 1. MARATHON POSTER IMAGE SECTION           -->
  <!-- ========================================== -->
  <div class="poster-container">
    <!-- கூகுள் டிரைவில் உள்ள உங்கள் படத்தின் FILE_ID-ஐ கீழே உள்ள 'YOUR_GOOGLE_DRIVE_FILE_ID' இடத்தில் மாற்றவும் -->
    <img src="https://lh3.googleusercontent.com/d/YOUR_GOOGLE_DRIVE_FILE_ID" alt="AKU Running Club Marathon Poster" class="poster-img">
  </div>

  <h2>Marathon Registration</h2>

  <form id="regForm">
    <div class="form-group">
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label for="whatsapp">WhatsApp Number *</label>
      <input type="tel" id="whatsapp" name="whatsapp" required pattern="[0-9]{10}" placeholder="10 Digit Mobile Number">
    </div>

    <div class="form-group">
      <label>Gender *</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female" required> Female</label>
      </div>
    </div>

    <div class="form-group">
      <label for="dob">Date of Birth *</label>
      <input type="date" id="dob" name="dob" required>
    </div>

    <div class="form-group">
      <label for="category">Race Category *</label>
      <select id="category" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="Category 2KM">2KM (5 - 12 Years)</option>
        <option value="Category 5KM">5KM (13 - 17 Years)</option>
        <option value="Category 10KM">10KM (18+ Open Male)</option>
        <option value="Category 8KM">8KM (18+ Open Female)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" required placeholder="example@gmail.com">
    </div>

    <div class="form-group">
      <label for="bloodGroup">Blood Group *</label>

      <select id="bloodGroup" name="bloodGroup" required>
        <option value="">-- Select Blood Group --</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
    </div>

    <div class="form-group">
      <label for="address">Full Address *</label>
      <textarea id="address" name="address" rows="3" required placeholder="Door No, Street, City, Pincode"></textarea>
    </div>

    <div class="fee-badge">
      Registration Fee: ₹250
    </div>

    <div class="form-group">
      <label for="transactionId">UPI Transaction ID / UTR No *</label>
      <input type="text" id="transactionId" name="transactionId" required placeholder="12 Digit UTR Number">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="dec1" name="dec1" value="Yes" required>
      <label for="dec1">I declare that all information provided above is true and accurate.</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="dec2" name="dec2" value="Yes" required>
      <label for="dec2">I agree to abide by all the rules and regulations of the AKU Running Club Marathon.</label>
    </div>

    <button type="submit" id="submitBtn">SUBMIT REGISTRATION</button>
  </form>

  <div id="responseMsg"></div>

</div>

<script>
  // ==========================================
  // 2. WEB APP SCRIPT URL SECTION
  // ==========================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrxcwcZkhGWeIw-XftaBNcnUjkWP0ldAjToY2Pt1AzO9MPRjnX0YtpzJGukaaO8MSh5g/exec";

  const form = document.getElementById('regForm');
  const submitBtn = document.getElementById('submitBtn');
  const responseMsg = document.getElementById('responseMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";
    responseMsg.style.display = "none";

    const formData = new FormData(form);

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      submitBtn.disabled = false;
      submitBtn.innerText = "SUBMIT REGISTRATION";
      
      if (data.result === 'success') {
        responseMsg.className = "success";
        responseMsg.innerText = "Registration Successful! Reg No: " + (data.regNo || '');
        responseMsg.style.display = "block";
        form.reset();
      } else {
        throw new Error(data.error || 'Submission failed');
      }
    })
    .catch(error => {
      submitBtn.disabled = false;
      submitBtn.innerText = "SUBMIT REGISTRATION";
      responseMsg.className = "error";
      responseMsg.innerText = "Error: " + error.message;
      responseMsg.style.display = "block";
    });
  });
</script>

</body>
</html>
